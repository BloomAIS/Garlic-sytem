<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garlic System</title>
</head>

<body>

<h2>Login Test</h2>

<input id="pass" type="password" placeholder="Enter passcode">
<button onclick="login()">Enter</button>

<p id="msg"></p>

<script>
function login() {
  var val = document.getElementById("pass").value;

  if (val === "1234") {
    document.body.innerHTML = "<h2>SUCCESS - YOU ARE IN</h2>";
  } else {
    document.getElementById("msg").innerText = "Wrong passcode: " + val;
  }
}
</script>

</body>
</html>
